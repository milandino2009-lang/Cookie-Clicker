<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stardust clicker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<main class="game-layout">
    <section class="cookie-area">
        <h1>Stardust Clicker</h1>
        <img id="cookiebutton" src="Stardust.png" alt="Stardust" class="stardust-image">
        <p id="cookiecount">0</p>
    </section>

    <aside class="shop-area">
        <h1>Upgrades</h1>
        <button id="upgrade">Upgrade click: 50 stardust</button>
        <p id="upgradecount">0</p>

        <h1>Productie eenheden</h1>
        <button id="grandma">Asteroids is 200 stardust</button>
        <p id="grandmacount">0</p>
        <button id="star">Stars is 600 stardust</button>
        <p id="starcOUNT">0</p>
        <button id="factory">Nebulas is 1000 stardust</button>
        <p id="factorycount">0</p>
        <button id="Galaxies">Galaxies is 6000 stardust</button>
        <p id="Galaxiescount">0</p>
        <button id="Black holes">Black holes is 15000 stardust</button>
        <p id="Black holescount">0</p>
        <button id="Galaxy Clusters">Galaxy Clusters is 24000 stardust</button>
        <p id="Galaxy Clusterscount">0</p>
        <button id="Superclusters">Superclusters is 35000 stardust</button>
        <p id="Superclusterscount">0</p>
        <button id="The Observable Universe">The Observable Universe is 60000 stardust</button>
        <p id="The Observable Universecount">0</p>
        <button id="Multiverse">Multiverse is 120000 stardust</button>
        <p id="Multiversecount">0</p>
    </aside>
</main>
<img src="cosmos.jpg" alt="Cosmosbackground" class="background-image">

</body>
</html>
