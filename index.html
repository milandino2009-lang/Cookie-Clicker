<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Stardust clicker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<main class="game-layout">
    <section class="cookie-area">
        <h1>Stardust Clicker</h1>
        <img id="cookiebutton" src="Stardust.png" alt="Stardust" class="stardust-image">
        <p id="cookiecount">0</p>
        <div class="save-controls" aria-label="Save game controls">
            <button id="savegame" type="button">Save Game</button>
            <button id="loadgame" type="button">Load Game</button>
            <p id="savestatus" role="status" aria-live="polite"></p>
        </div>
    </section>

    <aside class="shop-area">
        <h1>Upgrades</h1>
        <button id="upgrade" type="button">Upgrade klik: 50 stardust</button>
            <p id="upgradecount">0</p>
        <button id="engine-boost" type="button">Verbeterde motoren: 2500 stardust</button>
        <p id="engine-boost-count">0</p>
        <button id="stellar-core" type="button">Stellaire kern: 20000 stardust</button>
        <p id="stellar-core-count">0</p>
        <button id="cosmic-harmony" type="button">Kosmische harmonie: 100000 stardust</button>
        <p id="cosmic-harmony-count">0</p>

        <h2>Productie-eenheden</h2>
        <button id="grandma" type="button">Asteroids is 200 stardust</button>
        <p id="grandmacount">0</p>
        <button id="star" type="button">Stars is 600 stardust</button>
        <p id="starcount">0</p>
        <button id="factory" type="button">Nebulas is 1000 stardust</button>
        <p id="factorycount">0</p>
        <button id="Galaxies" type="button">Galaxies is 6000 stardust</button>
        <p id="Galaxiescount">0</p>
        <button id="Black holes" type="button">Black holes is 15000 stardust</button>
        <p id="Black holescount">0</p>
        <button id="Galaxy Clusters" type="button">Galaxy Clusters is 24000 stardust</button>
        <p id="Galaxy Clusterscount">0</p>
        <button id="Superclusters" type="button">Superclusters is 35000 stardust</button>
        <p id="Superclusterscount">0</p>
        <button id="The Observable Universe" type="button">The Observable Universe is 60000 stardust</button>
        <p id="The Observable Universecount">0</p>
        <button id="Multiverse" type="button">Multiverse is 120000 stardust</button>
        <p id="Multiversecount">0</p>
        <button id="engine-boost" type="button">Verbeterde motoren: 2500 stardust</button>
        <p id="engine-boost-count">0</p>
        <button id="stellar-core" type="button">Stellaire kern: 20000 stardust</button>
        <p id="stellar-core-count">0</p>
        <button id="cosmic-harmony" type="button">Kosmische harmonie: 100000 stardust</button>
        <p id="cosmic-harmony-count">0</p>

        <details class="owned-upgrades">
            <summary>Bekijk jouw upgrades</summary>
            <ul id="owned-upgrades" aria-live="polite"></ul>
        </details>
    </aside>
</main>
<img src="cosmos.jpg" alt="Cosmosbackground" class="background-image">

</body>
</html>
